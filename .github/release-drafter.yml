# Config for release-drafter/release-drafter.
# Used two ways in this repo:
#   1. .github/workflows/pr-labeler.yml runs this in dry-run mode purely for
#      the `autolabeler` side effect (labels PRs on open/reopen/synchronize).
#   2. .github/workflows/release.yml runs this in dry-run mode purely to read
#      the `resolved_version` output (computed from merged-PR labels via
#      version-resolver below); it does NOT use release-drafter to create or
#      manage the actual GitHub Release — release.yml does that itself so the
#      changelog body can be built safely from `git log` instead of
#      interpolating PR titles into a workflow run: block.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Label -> semver bump. A merged PR with none of these labels falls back to
# `default: patch` below — this is what "labels unlabeled = patch" means.
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
      - "chore"
      - "dependencies"
  default: patch

# Applied automatically to PRs by pr-labeler.yml, based on branch name or PR
# title. There is no established branch/title convention in this repo yet
# (the only PR merged so far, #22, predates this automation and used neither
# Conventional Commits nor a labeled branch prefix), so these patterns follow
# the common `feat/`, `fix/`, `type: subject` conventions as a reasonable
# default. Adjust here if the team settles on a different convention.
#
# Deliberately NO autolabeler rule for "major"/"breaking": pattern-matching
# free text (a Conventional-Commits "!:" title prefix, or the literal words
# "BREAKING CHANGE" anywhere in the title or body) to auto-apply a
# major-version label is unsafe. A PR that merely describes or discusses a
# breaking change -- e.g. a bug-fix PR whose description says "works around
# a BREAKING CHANGE in an upstream dependency" -- would get auto-labeled
# "major" with zero human intent behind it, and if merged while that label
# stood, release.yml would cut a real, unintended major version bump. This
# happened for real in a sibling repo (color-grading-skill): a PR body that
# used the phrase "BREAKING CHANGE" as prose, not as a release marker, was
# auto-labeled major by exactly this kind of rule. No PR was actually
# merged with the label attached that time, but it was one merge away from
# shipping an unintended vX.0.0. The "major"/"breaking" labels in
# version-resolver above still work -- they just require a human to apply
# them on purpose, every time; there is no text pattern anywhere in this
# file that can attach either label on its own.
autolabeler:
  - label: "feature"
    branch:
      - "/^feat(ure)?\\/.+/"
    title:
      - "/^feat(\\(.+\\))?:/i"
  - label: "fix"
    branch:
      - "/^fix\\/.+/"
    title:
      - "/^fix(\\(.+\\))?:/i"
  - label: "dependencies"
    files:
      - "package.json"
      - "package-lock.json"
    title:
      - "/^(chore|build)\\(deps\\):/i"
  - label: "chore"
    branch:
      - "/^chore\\/.+/"
    title:
      - "/^chore(\\(.+\\))?:/i"
    files:
      - "*.md"
      - ".github/**"

categories:
  - title: "Breaking Changes"
    labels:
      - "major"
      - "breaking"
  - title: "Features"
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  - title: "Bug Fixes"
    labels:
      - "patch"
      - "fix"
      - "bug"
  - title: "Dependencies"
    labels:
      - "dependencies"
  - title: "Maintenance"
    labels:
      - "chore"

exclude-labels:
  - "skip-changelog"

template: |
  ## What's Changed

  $CHANGES
