version: 2
updates:
  # GitHub Actions used in this repo's workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "chore"
    commit-message:
      prefix: "chore(deps)"

  # npm is the only package ecosystem currently in use (see package.json).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "chore"
    commit-message:
      prefix: "chore(deps)"
